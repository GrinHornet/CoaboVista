<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vista Resort</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfdff;--fg:#0a2540;--mut:#4a6785;--card:#fff;--line:#cfe0f5;--acc:#0b5ed7;--sun:#2f80ed;--ok:#0b7a4b;--bad:#b3362b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 'Bricolage Grotesque',system-ui,sans-serif}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:14px 5vw;border-bottom:1px solid var(--line)}
nav b{font-size:1.3rem;font-weight:800;margin-right:auto}
nav a{color:var(--fg);text-decoration:none;padding:4px 0}
nav a:hover,nav a.on{border-bottom:2px solid var(--sun)}
main{max-width:1000px;margin:0 auto;padding:28px 5vw 60px}
.hero{position:relative;overflow:hidden;min-height:540px;margin:-28px -5vw 30px;background-size:cover;background-position:center 60%;color:#1b3558;display:flex;flex-direction:column;justify-content:center;padding:50px 6vw 90px}
.hero:before{content:'';position:absolute;top:0;bottom:0;left:0;width:50%;background:rgba(255,255,255,.62);backdrop-filter:blur(4px);clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.hero:after{content:'';position:absolute;top:0;bottom:0;right:0;width:14%;background:rgba(255,255,255,.28);clip-path:polygon(40% 0,100% 0,100% 100%,0 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(2.1rem,5vw,3.3rem);line-height:1.12;font-weight:400;font-style:italic;margin:0 0 14px;max-width:11em}
.hero p{max-width:30ch;font-size:.95rem;color:#3d5878;margin:0 0 26px}
.hr{position:relative;margin:-28px -5vw 0;min-height:560px;background-size:cover;background-position:center 55%;color:#fff;padding:80px 6vw 140px}
.hr:before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(4,30,80,.93) 0%,rgba(6,70,150,.62) 45%,rgba(0,0,0,0) 80%)}
.hr>*{position:relative}
.pill{display:inline-block;background:#1a8cff;color:#fff;border-radius:20px;padding:4px 14px;font-size:.85rem;margin-bottom:18px}
.hr h1{font-size:clamp(2.3rem,6vw,3.7rem);line-height:1.08;font-weight:800;max-width:9em;margin:0 0 16px}.hr h1 em,.bl{font-style:normal;color:#38a8ff}
.hr p{max-width:38ch;opacity:.92;margin:0 0 26px}
.hr .btn,.hr .btn.alt{border-radius:30px}.hr .btn.alt{color:#fff}
.wave{position:absolute!important;left:0;bottom:-1px;width:100%;height:70px;display:block}
.fs{margin:-36px auto 36px;position:relative;z-index:2}
.eb{color:#1a8cff;font-size:.78rem;font-weight:600;display:flex;gap:8px;align-items:center}.eb:before{content:'';width:22px;height:2px;background:#1a8cff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin:10px 0}
.col{position:relative;height:340px}.col .p{position:absolute;border:6px solid #fff;border-radius:12px;box-shadow:0 10px 30px rgba(10,50,110,.25);overflow:hidden}.col .p img{width:100%;height:100%;object-fit:cover;display:block}
.feat{display:flex;gap:22px;margin:18px 0}.feat div{text-align:center;font-size:.8rem;color:var(--mut)}.ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:#1a8cff;margin:0 auto 4px;font-size:1.2rem;background:#fff}
.bn{position:relative;margin:34px -5vw;min-height:280px;background-size:cover;background-position:center;display:grid;place-items:center;text-align:center;color:#fff;padding:60px 20px}.bn:before{content:'';position:absolute;inset:0;background:rgba(5,50,110,.38)}.bn>*{position:relative}
.bn .wave.t{top:-1px;bottom:auto;transform:rotate(180deg)}
.play{width:64px;height:64px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:1.3rem;margin:0 auto 12px}
.dc{padding:0;overflow:hidden;border-radius:14px;box-shadow:0 4px 18px rgba(10,60,120,.12)}.dc .pic{border-radius:0;aspect-ratio:16/9}.dc .in{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.dc small{color:var(--mut)}
.dc a{color:inherit;text-decoration:none;display:block}.dc .go{color:#1a8cff;font-size:1.3rem}
.vh{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px}.vh h2{margin:6px 0}
@media(max-width:700px){.two{grid-template-columns:1fr}.hr:before{background:rgba(4,30,80,.74)}.col{height:300px}}
.tm{margin:40px 0 10px}.tm .sc{font-family:'Dancing Script',cursive;color:#1a8cff;font-size:2.2rem;text-align:center;margin:0;line-height:1.1}.tm h2{text-align:center;text-transform:uppercase;font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 18px;color:#0b3a7a}
.tc{display:flex;gap:16px;align-items:center;max-width:740px;margin:14px auto;padding:18px 22px;border-radius:24px;box-shadow:0 6px 18px rgba(10,60,120,.12);border:1px solid var(--line);background:#fff}
.tc:nth-child(odd){background:#d9eaff;transform:rotate(-1.2deg)}.tc:nth-child(even){transform:rotate(.6deg)}
.av{flex:0 0 66px;height:66px;border-radius:50%;border:3px solid #fff;background:linear-gradient(140deg,#4da3ff,#0b3a7a);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem;box-shadow:0 3px 8px rgba(10,60,120,.25)}
.tc .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tc b{font-size:1.15rem;color:#0b3a7a}
.st{background:#fff;border-radius:20px;padding:2px 14px;color:#1a6fd6;letter-spacing:2px;box-shadow:0 2px 6px rgba(10,60,120,.12)}.tc:nth-child(even) .st{background:#d9eaff}
.tc p{margin:6px 0 0;font-size:.92rem;color:#2c4a70}
@media(max-width:520px){.tc{padding:14px}.av{flex-basis:52px;height:52px;font-size:1.1rem}}
.hsearch{display:flex;flex-wrap:wrap;align-items:stretch;background:#fff;border-radius:40px;box-shadow:0 8px 28px rgba(10,60,120,.25);width:min(660px,100%);overflow:hidden}
.hsearch label{flex:1 1 130px;padding:10px 18px;font-size:.78rem;font-weight:400;color:#6a82a3;border-right:1px solid var(--line);gap:0}
.hsearch input,.hsearch select{border:0;padding:2px 0;font-size:1rem;font-weight:600;color:#1b3558;background:transparent;border-radius:0}
.hsearch button{flex:0 0 auto;border:0;background:#1ab0e8;color:#fff;font:inherit;font-weight:600;font-size:1.1rem;padding:0 38px;min-height:56px;cursor:pointer;border-radius:40px}
.disc{position:absolute!important;left:6vw;bottom:34px;display:flex;align-items:center;gap:18px}
.disc b{display:block;font-size:1.35rem;font-style:italic;font-weight:400}
.disc a,.soc a{width:28px;height:28px;border:1.5px solid #1b3558;border-radius:50%;display:grid;place-items:center;color:#1b3558;text-decoration:none;font-size:.8rem}
.soc{position:absolute!important;right:6vw;bottom:34px;display:flex;gap:14px}.soc a{background:#fff;border-color:#fff}
@media(max-width:700px){.hero:before{width:100%;clip-path:none;background:rgba(255,255,255,.72)}.hero:after{display:none}.hsearch{border-radius:20px}.hsearch button{width:100%;border-radius:0}.disc{display:none!important}}
h2{font-size:1.7rem;margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.sw{height:130px;border-radius:6px;margin-bottom:12px;overflow:hidden}.sw img,.pic img{width:100%;height:100%;object-fit:cover;display:block}.sw svg,.pic svg{width:100%;height:100%;display:block}.pic{border-radius:8px;overflow:hidden;aspect-ratio:15/8}.am{text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;overflow:hidden}.am b{display:block;padding:10px 14px}#md{position:fixed;inset:0;background:rgba(5,20,45,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#md.on{display:flex}#md .card{max-width:760px;width:100%;max-height:90vh;overflow:auto}
.price{font-weight:800;font-size:1.2rem}
.btn{display:inline-block;background:var(--sun);color:#fff;border:0;border-radius:8px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;border:1.5px solid currentColor;color:inherit}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
form{display:grid;gap:14px;max-width:560px}
label{display:grid;gap:4px;font-weight:600}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sun);border-radius:8px;padding:14px}
.msg{padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag{display:inline-block;background:var(--sun);color:#fff;border-radius:20px;padding:2px 12px;font-size:.9rem;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center}
.drop img{max-width:200px;border-radius:6px;margin-top:10px}
.tbl{overflow-x:auto}
ul{padding-left:20px}
footer{padding:24px 5vw;border-top:1px solid var(--line);color:var(--mut)}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body>

addEventListener('click',e=>{const b=e.target.closest('[data-am]');if(b)openAm(+b.dataset.am);else if(e.target.id=='md'||e.target.id=='mc')$('#md').classList.remove('on')});

const FAQ=[['Check-in and check-out?','Check-in is 2:00 PM and check-out is 12:00 NN.'],['Do you accept GCash?','Yes. Pay in the GCash app, then upload your screenshot on the Payment page.'],['Can I cancel or change dates?','Free changes up to 3 days before arrival, subject to availability.'],['Are pets allowed?','Small pets are allowed in Garden Villas only.']];

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return window['_'+k]=v===undefined?window['_'+k]:v}}

const nights=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function avail(id,a,b){const bl=BLOCKED[id]||[];const n=nights(a,b);if(!(n>0))return null;
 for(let i=0;i<n;i++){const d=new Date(new Date(a).getTime()+i*864e5).toISOString().slice(0,10);if(bl.includes(d))return false}
 return !Object.values(bookings()).some(x=>x.room===id&&x.status!=='Payment Rejected'&&a<x.out&&b>x.in)}

<div class="two"><div class="col">${pic('pool','left:0;top:24px;width:62%;height:62%;transform:rotate(-3deg);z-index:1')}${pic('garden','right:0;top:0;width:40%;height:44%;transform:rotate(4deg);z-index:2')}${pic('suite','right:4%;bottom:0;width:48%;height:42%;transform:rotate(-4deg);z-index:2')}</div>

<div class="vh"><div><div class="eb">Explore your next</div><h2>Explore Your Favorite <span class="bl">Stays</span></h2></div><a class="btn alt" href="#rooms" style="border-radius:30px">View all rooms ›</a></div>
<div class="grid">${ROOMS.slice(0,3).map((r,i)=>`<div class="card dc"><a href="#book?room=${r.id}"><div class="pic">${scene('room',i)}</div><div class="in"><span><b>${r.name}</b><br><small>${peso(r.price)} / night · up to ${r.guests} guests</small></span><span class="go">›</span></div></a></div>`).join('')}</div>
<h2>Amenities</h2>${amGrid()}
<section class="tm"><p class="sc">Guest Testimonials</p><h2>What guests say?</h2><div class="tc"><div class="av" aria-hidden="true">MS</div><div style="flex:1"><div class="hd"><b>Maria Santos 🇵🇭</b><span class="st" aria-label="5 stars">★★★★★</span></div><p>“The rooms were spotless and the staff greeted us by name. The pool was quiet in the mornings, which our kids loved.”</p></div></div><div class="tc"><div class="av" aria-hidden="true">JDC</div><div style="flex:1"><div class="hd"><b>Jun Dela Cruz 🇵🇭</b><span class="st" aria-label="5 stars">★★★★★</span></div><p>“Booking was easy, and the team confirmed my GCash payment the same day. Check-in took just a few minutes.”</p></div></div><div class="tc"><div class="av" aria-hidden="true">AR</div><div style="flex:1"><div class="hd"><b>Angela Reyes 🇵🇭</b><span class="st" aria-label="5 stars">★★★★★</span></div><p>“The Garden Villa was peaceful and beautiful. We woke up to birds and had breakfast on the terrace.”</p></div></div><div class="tc"><div class="av" aria-hidden="true">MV</div><div style="flex:1"><div class="hd"><b>Mark Villanueva 🇵🇭</b><span class="st" aria-label="5 stars">★★★★★</span></div><p>“We held a family reunion in the function hall. The staff helped with setup and everyone had a great time.”</p></div></div><div class="tc"><div class="av" aria-hidden="true">PL</div><div style="flex:1"><div class="hd"><b>Patricia Lim 🇵🇭</b><span class="st" aria-label="5 stars">★★★★★</span></div><p>“Room service arrived fast and the food was hot. The beds were so comfortable we extended our stay by a night.”</p></div></div><div class="tc"><div class="av" aria-hidden="true">CM</div><div style="flex:1"><div class="hd"><b>Carlo Mendoza 🇵🇭</b><span class="st" aria-label="5 stars">★★★★★</span></div><p>“Great value for the price. The play area is safe and well kept, so we could relax by the pool.”</p></div></div></section>`},

<div class="row"><label>Check-in<input type="date" name="in" required></label><label>Check-out<input type="date" name="out" required></label></div>
<div class="row"><label>Adults<input type="number" name="adults" min="1" value="2"></label><label>Children<input type="number" name="kids" min="0" value="0"></label></div>
<label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Contact number<input name="phone" required></label>
<fieldset class="card">${SERVICES.map((s,i)=>`<label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" style="width:auto" name="svc" value="${i}"> ${s[0]} (${peso(s[1])})</label>`).join('')}</fieldset>
<label>Special requests<textarea name="req" rows="2"></textarea></label>
<div class="sum" id="sum">Pick your dates to see the total.</div><div id="av"></div>

<div class="row"><label>Transaction date<input type="date" name="date" required></label><label>Transaction reference no.<input name="txn" required></label></div>
<div class="drop"><label>Payment screenshot (JPG or PNG)<input type="file" name="img" accept="image/jpeg,image/png" required></label><div id="pv"></div></div>
<button class="btn" type="submit">Submit payment proof</button><div id="pm"></div></form>`},

};
function card(r){return `<div class="card"><div class="sw">${scene('room',ROOMS.indexOf(r))}</div><b>${r.name}</b><p>${r.d}</p><p>Up to ${r.guests} guests · ${r.bed} · ${r.size}</p><span class="price">${peso(r.price)}</span> / night<br><br><a class="btn" href="#book?room=${r.id}">Book now</a></div>`}
const NAV=[['home','Home'],['rooms','Rooms'],['amenities','Amenities'],['book','Book now'],['pay','Payment'],['status','My booking'],['faq','FAQ / Contact']];
function route(){const [p,qs]=(location.hash.slice(1)||'home').split('?');const q=Object.fromEntries(new URLSearchParams(qs||''));const pg=pages[p]?p:'home';
 $('#nav').innerHTML='<b>Vista Resort</b>'+NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===pg?'on':''}">${n[1]}</a>`).join('');

function calc(f){const r=ROOMS.find(x=>x.id===f.room.value),n=nights(f.in.value,f.out.value);
 const svc=[...f.querySelectorAll('[name=svc]:checked')].reduce((t,c)=>t+SERVICES[c.value][1]*(c.value==='1'?1:Math.max(n,0)),0);
 return {r,n,total:r.price*Math.max(n,0)+svc,svc}}
function initHome(){const f=$('#hs'),t=new Date().toISOString().slice(0,10);f.in.min=t;f.out.min=t;f.in.onchange=()=>{f.out.min=f.in.value};
 f.onsubmit=e=>{e.preventDefault();if(f.out.value<=f.in.value){f.out.setCustomValidity('Check-out must be after check-in');f.out.reportValidity();return}f.out.setCustomValidity('');location.hash=`#book?in=${f.in.value}&out=${f.out.value}&adults=${f.p.value}`}}
function initBook(q){const f=$('#bf');const t=new Date().toISOString().slice(0,10);f.in.min=t;f.out.min=t;if(q&&q.in){f.in.value=q.in;f.out.value=q.out;f.adults.value=q.adults||2;setTimeout(()=>f.dispatchEvent(new Event('input')),0)}
 const upd=()=>{const c=calc(f);if(!(c.n>0)){$('#sum').textContent='Pick valid dates to see the total.';$('#av').innerHTML='';return}
  const a=avail(c.r.id,f.in.value,f.out.value),g=+f.adults.value+ +f.kids.value;
  $('#sum').innerHTML=`${peso(c.r.price)} × ${c.n} night${c.n>1?'s':''}${c.svc?` + services ${peso(c.svc)}`:''}<br><b>Estimated total: ${peso(c.total)}</b>`;
  $('#av').innerHTML=g>c.r.guests?`<p class="bad">${c.r.name} fits up to ${c.r.guests} guests. Choose another room or reduce guests.</p>`:a?`<p class="ok">${c.r.name} is available for your dates.</p>`:`<p class="bad">This room is unavailable for those dates. Choose another room or dates.</p>`};
 f.addEventListener('input',upd);
 f.onsubmit=e=>{e.preventDefault();const c=calc(f);const g=+f.adults.value+ +f.kids.value;
  if(!(c.n>0)||g>c.r.guests||!avail(c.r.id,f.in.value,f.out.value)){upd();return}
  const all=bookings(),ref='VISTA-2026-'+String(Object.keys(all).length+1).padStart(5,'0');
  all[ref]={ref,room:c.r.id,in:f.in.value,out:f.out.value,n:c.n,guests:g,name:f.name.value,email:f.email.value.toLowerCase(),total:c.total,status:'Pending Payment'};store('vista_b',all);
  $('#app').innerHTML=`<h2>Booking confirmation</h2><div class="card"><p>Reference: <b>${ref}</b></p><p>${f.name.value} · ${c.r.name}<br>${f.in.value} to ${f.out.value} (${c.n} nights) · ${g} guests</p><p class="price">Total: ${peso(c.total)}</p><span class="tag">Pending Payment</span><p>Keep your reference number. Pay within 24 hours to hold the room.</p><a class="btn" href="#pay?ref=${ref}">Pay now</a></div>`}}
function initPay(){const f=$('#pf');f.img.onchange=()=>{const x=f.img.files[0];$('#pv').innerHTML=x?`<img alt="Screenshot preview" src="${URL.createObjectURL(x)}">`:''};
 f.onsubmit=e=>{e.preventDefault();const all=bookings(),b=all[f.ref.value.trim().toUpperCase()];
  if(!b){$('#pm').innerHTML='<p class="bad">Reference not found. Check the number from your confirmation.</p>';return}
  b.status='Payment Submitted';b.proof={m:f.m.value,amt:f.amt.value,txn:f.txn.value,file:f.img.files[0].name};store('vista_b',all);
  $('#pm').innerHTML=`<p class="ok">Your payment screenshot was submitted and is awaiting verification.</p><a class="btn alt" href="#status">Check my booking</a>`}}
function initStatus(){$('#sf').onsubmit=e=>{e.preventDefault();const f=e.target,b=bookings()[f.ref.value.trim().toUpperCase()];
 $('#sr').innerHTML=b&&b.email===f.email.value.toLowerCase()?`<div class="card"><b>Booking found</b><p>${ROOMS.find(x=>x.id===b.room).name} · ${b.in} to ${b.out}<br>Total ${peso(b.total)}</p><span class="tag">${b.status}</span>${b.status==='Payment Submitted'?`<p><button class="btn alt" id="sim">Demo: mark as verified</button></p>`:''}</div>`:'<p class="bad">No booking matches that reference and email.</p>';
 $('#sim')?.addEventListener('click',()=>{const all=bookings();all[b.ref].status='Booking Confirmed';store('vista_b',all);f.onsubmit(e)})}}
